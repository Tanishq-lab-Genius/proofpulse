name: Go build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
      - name: Build ProofPulse service
        run: go build -o "$RUNNER_TEMP/proofpulse" ./cmd/proofpulse
      - name: Build Bifrost plugin
        working-directory: bifrost-plugin
        run: go build -buildmode=plugin -o "$RUNNER_TEMP/proofpulse.so" .
