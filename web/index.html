<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ProofPulse</title>
    <style>
      body { margin: 0; background: #090b13; color: #edf0ff; font: 16px/1.5 Inter, system-ui, sans-serif; }
      main { max-width: 960px; margin: auto; padding: 64px 24px; }
      h1 { font-size: clamp(2.4rem, 7vw, 4.5rem); margin: 0; letter-spacing: -.06em; }
      .accent { color: #a78bfa; } .lead { color: #aeb7d2; max-width: 680px; font-size: 1.15rem; }
      .included { display: flex; gap: 12px; align-items: flex-start; max-width: 640px; margin: 20px 0 28px; padding: 14px 18px; border: 1px solid rgba(84,224,190,.28); border-radius: 12px; background: linear-gradient(110deg, rgba(84,224,190,.10), rgba(167,139,250,.09)); color: #aeb7d2; }
      .included p { margin: 0; } .included strong { color: #54e0be; } .included .check { color: #54e0be; font-weight: 800; }
      textarea { width: 100%; min-height: 110px; box-sizing: border-box; margin: 24px 0 12px; padding: 16px; color: inherit; background: #111526; border: 1px solid #303958; border-radius: 12px; font: inherit; }
      button { border: 0; border-radius: 10px; padding: 13px 18px; font-weight: 700; color: #fff; background: #7656ff; cursor: pointer; }
      #status { color: #aeb7d2; margin-left: 12px; } #results { margin-top: 36px; display: grid; gap: 16px; }
      .card { background: #111526; border: 1px solid #252d47; padding: 20px; border-radius: 14px; }
      .claim { border-left: 3px solid #7656ff; } .status { text-transform: uppercase; font-size: .75rem; font-weight: 800; color: #c4b5fd; }
      a { color: #b8a8ff; } pre { white-space: pre-wrap; font: inherit; }
    </style>
  </head>
  <body>
    <main>
      <p class="accent">BIFROST × TAVILY</p>
      <h1>Trust answers that <span class="accent">stay current.</span></h1>
      <p class="lead">ProofPulse verifies time-sensitive AI claims against live web evidence before users rely on them.</p>
      <div class="included" role="note"><span class="check" aria-hidden="true">✓</span><p><strong>Tavily-powered research is included.</strong> Customers do not need to provide their own Tavily API key.</p></div>
      <textarea id="question" placeholder="Ask a time-sensitive question, for example: Who is the current CEO of Microsoft and what was its most recent major AI announcement?"></textarea>
      <button id="verify">Generate and verify</button><span id="status"></span>
      <section id="results"></section>
    </main>
    <script>
      const button = document.querySelector('#verify'); const status = document.querySelector('#status'); const results = document.querySelector('#results');
      const escapeHtml = value => value.replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
      button.onclick = async () => {
        const question = document.querySelector('#question').value.trim(); if (!question) return;
        button.disabled = true; status.textContent = 'Checking live evidence…'; results.innerHTML = '';
        try {
          const response = await fetch('/api/verify', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({question})});
          const data = await response.json(); if (!response.ok) throw new Error(data.detail || 'Verification failed');
          results.innerHTML = `<article class="card"><div class="status">Draft answer</div><pre>${escapeHtml(data.draft_answer)}</pre></article>` +
            data.verifications.map(item => `<article class="card claim"><div class="status">${item.status} · ${item.freshness_score}% fresh</div><strong>${escapeHtml(item.claim)}</strong><p>${escapeHtml(item.explanation)}</p>${item.corrected_claim ? `<p><b>Correction:</b> ${escapeHtml(item.corrected_claim)}</p>` : ''}<ul>${item.sources.map(source => `<li><a href="${escapeHtml(source.url)}" target="_blank" rel="noreferrer">${escapeHtml(source.title)}</a></li>`).join('')}</ul></article>`).join('') +
            `<article class="card"><div class="status">Verified answer</div><pre>${escapeHtml(data.verified_answer)}</pre><small>${data.claims_checked} claims checked · ${data.sources_used} sources used</small></article>`;
          status.textContent = data.verification_note || 'Verification complete.';
        } catch (error) { status.textContent = error.message; }
        finally { button.disabled = false; }
      };
    </script>
  </body>
</html>
